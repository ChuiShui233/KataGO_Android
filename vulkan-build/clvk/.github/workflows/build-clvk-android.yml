name: Build clvk (OpenCL-on-Vulkan) for Android arm64

# KataGo 本身没有 Vulkan 后端。此 workflow 把 clvk (Khronos OpenCL 3.0 在
# Vulkan 上的实现) + clspv (OpenCL C -> SPIR-V 编译器) 交叉编译成
# aarch64-linux-android 的 libOpenCL.so。
#
# 产物放到 kataA/app/src/main/jniLibs/arm64-v8a/libOpenCL.so 后，KataGo 现有
# 的 OpenCL 后端就会直接跑在设备的 Vulkan 驱动上 (在线编译内核，无需额外
# clspv 二进制)。
#
# 参考：kpet/clvk 官方 presubmit.yml 的 Android 矩阵。
#   - NDK r27d，API 29 (与 app 的 minSdk 一致)
#   - 先在本机(runner, x86-64)用 host clang 编出 libclc 的 SPIR-V 库，
#     再以 -DCLSPV_EXTERNAL_LIBCLC_DIR 交给 Android 交叉构建
#   - CLVK_CLSPV_ONLINE_COMPILER=ON:libOpenCL.so 内嵌 clspv/LLVM，
#     设备上无需外部编译器进程
#
# 注意：构建本 fork (messycodes/KataT) 的 main —— 补丁已直接提交在 fork 里
# (见 a942055)，无需再 git apply。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-clvk-android.yml'

env:
  NDK_VERSION: r27d

jobs:
  build:
    name: clvk arm64-v8a (online compiler)
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space on runner
        run: |
          sudo apt-get update
          sudo apt-get remove -y '^dotnet-.*' '^temurin-.*' \
            azure-cli google-cloud-cli microsoft-edge-stable \
            google-chrome-stable firefox
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          df -h

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          max-size: 4G
          key: clvk-android-${{ env.NDK_VERSION }}-online

      - name: Checkout clvk (this fork)
        uses: actions/checkout@v4
        with:
          repository: messycodes/KataT
          ref: main
          fetch-depth: 0
          submodules: recursive
          path: clvk

      - name: Download and extract Android NDK
        run: |
          mkdir -p ndk && cd ndk
          wget -q https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip
          unzip -q android-ndk-${{ env.NDK_VERSION }}-linux.zip
          rm android-ndk-${{ env.NDK_VERSION }}-linux.zip
          ls -d android-ndk-*

      - name: Fetch LLVM
        working-directory: clvk
        run: python3 ./external/clspv/utils/fetch_sources.py --shallow --deps llvm

      - name: Build host clang + libclc (SPIR-V builtin library)
        env:
          LIBCLC_DIR: ${{ github.workspace }}/libclc
          BUILD_LIBCLC_DIR: ${{ github.workspace }}/build_libclc
        run: |
          set -euxo pipefail
          echo "libclc=${LIBCLC_DIR}" >> "$GITHUB_ENV"
          cmake -S ${{ github.workspace }}/clvk/external/clspv/third_party/llvm/llvm \
                -B "$BUILD_LIBCLC_DIR" -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DRUNTIMES_spirv32-unknown-vulkan_LLVM_ENABLE_RUNTIMES=libclc \
            -DRUNTIMES_spirv64-unknown-vulkan_LLVM_ENABLE_RUNTIMES=libclc \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_RUNTIME_TARGETS="spirv32-unknown-vulkan;spirv64-unknown-vulkan"
          cmake --build "$BUILD_LIBCLC_DIR" --target libclc --parallel
          mkdir -p "$LIBCLC_DIR/spirv32-unknown-vulkan" "$LIBCLC_DIR/spirv64-unknown-vulkan"
          cp "$(find "$BUILD_LIBCLC_DIR" -name libclc.bc | grep spirv32-unknown-vulkan)" \
             "$LIBCLC_DIR/spirv32-unknown-vulkan/"
          cp "$(find "$BUILD_LIBCLC_DIR" -name libclc.bc | grep spirv64-unknown-vulkan)" \
             "$LIBCLC_DIR/spirv64-unknown-vulkan/"
          rm -rf "$BUILD_LIBCLC_DIR"

      - name: Configure clvk for Android
        env:
          NDK_ROOT: ${{ github.workspace }}/ndk/android-ndk-${{ env.NDK_VERSION }}
          SYSROOT: ${{ github.workspace }}/ndk/android-ndk-${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: |
          set -euxo pipefail
          cmake -S ${{ github.workspace }}/clvk -B ${{ github.workspace }}/build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_NDK=$NDK_ROOT \
            -DCLVK_VULKAN_IMPLEMENTATION=system \
            -DVulkan_INCLUDE_DIR=$SYSROOT/usr/include \
            -DVulkan_LIBRARY=$SYSROOT/usr/lib/aarch64-linux-android/29/libvulkan.so \
            -DCLSPV_EXTERNAL_LIBCLC_DIR=${{ env.libclc }} \
            -DCLVK_CLSPV_ONLINE_COMPILER=ON \
            -DCLVK_BUILD_TESTS=OFF \
            -DCLVK_UNIT_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: Build libOpenCL.so
        run: cmake --build ${{ github.workspace }}/build --config Release --target OpenCL --parallel

      - name: Show artifact details
        run: |
          ls -lh ${{ github.workspace }}/build/libOpenCL.so
          file ${{ github.workspace }}/build/libOpenCL.so || true

      - name: Upload libOpenCL.so
        uses: actions/upload-artifact@v4
        with:
          name: libOpenCL-clvk-arm64-v8a
          path: ${{ github.workspace }}/build/libOpenCL.so
          if-no-files-found: error

      - name: Upload build log (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clvk-build-failure
          path: |
            ${{ github.workspace }}/build/ninja_log
            ${{ github.workspace }}/build/CMakeFiles/CMakeOutput.log
            ${{ github.workspace }}/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
