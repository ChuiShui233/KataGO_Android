org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Release signing: 广州吹水网络有限公司 / 吹水明月
# 密钥库文件 app/keystore/katago-release.keystore 不入库（已在 .gitignore 中忽略）。
# 密码请勿写入本文件，请通过环境变量提供后再构建 release：
#   export KATA_ANDROID_KEYSTORE_PASSWORD=...
#   export KATA_ANDROID_KEY_PASSWORD=...
# 不设置则 release 构建不签名。
KATA_ANDROID_KEYSTORE=app/keystore/katago-release.keystore
KATA_ANDROID_KEY_ALIAS=katago
